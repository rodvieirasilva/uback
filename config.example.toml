# Copy this file to config.toml and fill in your local backup details.
# config.toml is gitignored and will NEVER be committed.

[destination]
# Supported destination types: "smb_nas" (SMB2/SMB3 share) or "s3" (S3 / S3-compatible).
type = "smb_nas"

[smb]
# SMB server IP or hostname (Windows shared folder, Linux Samba, macOS File Sharing, or NAS).
host = "192.168.1.100"
port = 445
# Top-level SMB share name exported by the server: smb://<host>/<share>/<base_path>
share = "backup"
base_path = "phones"
username = "backup_user"
password = "change_me"
domain = ""
# Enable parallel small-file workers (<= 5 MB) for faster SMB transfers of many small photos/docs.
parallel_enabled = false

[whatsapp]
# Optional 64-digit end-to-end encrypted backup key (from WhatsApp -> Settings -> Chats -> Chat backup)
# Used locally on-device to export incremental SQLite chat deltas (.db) from msgstore.db.crypt15.
key_64 = ""

# Telegram incremental chat deltas (enabled by default).
# Provide your Telegram Client API credentials from https://my.telegram.org.
[telegram]
enabled = true
api_id = ""
api_hash = ""
phone_number = ""
password = ""

# Optional per-device profile overrides (used by scripts/build_device_apks.py via UBACK_PROFILE)
# [profiles.example_device]
# enable_telegram = false
