# Copy this file to `config.toml` and fill in your local backup destination defaults.
# `config.toml` is gitignored and injected at compile time as default app settings.

[destination]
# Supported destination types: "smb_nas" (extensible for future destinations)
type = "smb_nas"

[smb]
host = "192.168.1.100"
port = 445
share = "safe"
base_path = "local/phone"
username = "your-nas-user"
password = "your-nas-password"
domain = ""

# Optional: 64-digit hex WhatsApp end-to-end encrypted backup key for on-device
# incremental SQLite chat deltas (`msgstore_delta_*.db`). Leave empty to configure in Settings.
[whatsapp]
backup_key_64 = ""

# Optional: Compile-time flag to include Telegram incremental chat delta support.
# When enabled = true, provide your Telegram API credentials from https://my.telegram.org.
[telegram]
enabled = true
api_id = ""
api_hash = ""
phone_number = ""
password = ""
