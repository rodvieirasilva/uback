# Copy this file to `config.toml` and fill in your local backup destination defaults.
# `config.toml` is gitignored and injected at compile time as default app settings.

[destination]
# Supported destination types: "smb_nas" (extensible for future destinations)
type = "smb_nas"

[smb]
host = "192.168.1.100"
port = 445
share = "safe"
base_path = "local/phone"
username = "your-nas-user"
password = "your-nas-password"
domain = ""
